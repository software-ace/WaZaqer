# .deb and .rpm from the Flutter release bundle (build/linux/x64/release/bundle).
# Run from the repo root:  VERSION=1.0.0 nfpm package -f linux/packaging/nfpm.yaml -p deb
name: wazaqer
arch: amd64
platform: linux
version: ${VERSION}
section: misc
priority: optional
maintainer: software-ace <a.abuyahia@protonmail.com>
description: |
  Free and open-source adhkar app (وَذَكِر).
  Daily adhkar with a counter, tasbeeh, offline prayer times and qibla, in
  Arabic. No ads, no trackers, nothing leaves the device.
homepage: https://github.com/software-ace/WaZaqer
license: GPL-3.0-or-later

contents:
  # The bundle finds its lib/ and data/ next to the real executable, so it
  # stays together under /opt and /usr/bin only holds a symlink.
  # type: tree keeps lib/ and data/; a plain directory src is flattened.
  - src: build/linux/x64/release/bundle
    dst: /opt/wazaqer
    type: tree
  - src: /opt/wazaqer/wazaqer
    dst: /usr/bin/wazaqer
    type: symlink
  - src: linux/packaging/ace.software.wazaqer.desktop
    dst: /usr/share/applications/ace.software.wazaqer.desktop
  # Same artwork as the store listing.
  - src: fastlane/metadata/android/en-US/images/icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/ace.software.wazaqer.png
  - src: LICENSE
    dst: /usr/share/licenses/wazaqer/LICENSE

overrides:
  deb:
    depends:
      - libc6 (>= 2.35) # CI builds on Ubuntu 22.04
      - libgtk-3-0t64 | libgtk-3-0 # renamed in Ubuntu 24.04 / Debian 13
      # Loaded at run time by Flutter, so not among the linked libraries.
      - libegl1
      - libgles2
  rpm:
    # By library rather than package name, so the same package resolves on
    # Fedora and openSUSE, which name these packages differently.
    depends:
      - libgtk-3.so.0()(64bit)
      - libEGL.so.1()(64bit) # these two are loaded at run time by Flutter
      - libGLESv2.so.2()(64bit)

rpm:
  compression: zstd # as Fedora's own packages use
